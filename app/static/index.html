<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Agent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
        }

        .status.running {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
        }

        .status.solved {
            background: #d4edda;
            color: #155724;
            border: 1px solid #28a745;
        }

        .status.failed {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #dc3545;
        }

        .trajectory {
            max-height: 400px;
            overflow-y: auto;
            background: white;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .trajectory-step {
            padding: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }

        .trajectory-step h4 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .trajectory-step p {
            margin: 5px 0;
            font-size: 14px;
        }

        .flag {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CTF Agent Dashboard</h1>
            <p>Autonomous CTF Challenge-Solving AI</p>
        </div>

        <div class="content">
            <div class="grid">
                <div class="section">
                    <h2>Start New Challenge</h2>
                    <div class="form-group">
                        <label for="challengeId">Challenge ID:</label>
                        <input type="text" id="challengeId" placeholder="demo-web" value="demo-web">
                    </div>
                    <div class="form-group">
                        <label for="targetUrl">Target URL:</label>
                        <input type="text" id="targetUrl" placeholder="http://localhost:8000" value="http://localhost:8000">
                    </div>
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea id="description" rows="3" placeholder="Challenge description...">Simple web login challenge with SQL injection vulnerability</textarea>
                    </div>
                    <button onclick="startChallenge()" id="startBtn">Start Agent</button>
                </div>

                <div class="section">
                    <h2>Agent Status</h2>
                    <div id="statusDisplay" class="status">
                        <p>Ready to start a challenge</p>
                    </div>
                    <div id="flagDisplay" style="display: none;"></div>
                </div>
            </div>

            <div class="section">
                <h2>Agent Trajectory</h2>
                <div id="trajectory" class="trajectory">
                    <p>Agent trajectory will appear here...</p>
                </div>
            </div>

            <div class="section">
                <h2>Knowledge Base Search</h2>
                <div class="form-group">
                    <label for="searchQuery">Search Query:</label>
                    <input type="text" id="searchQuery" placeholder="SQL injection techniques">
                </div>
                <button onclick="searchKnowledge()">Search Knowledge Base</button>
                <div id="searchResults" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let currentRunId = null;
        let statusInterval = null;

        async function startChallenge() {
            const challengeId = document.getElementById('challengeId').value;
            const targetUrl = document.getElementById('targetUrl').value;
            const description = document.getElementById('description').value;

            if (!challengeId || !targetUrl) {
                alert('Please fill in challenge ID and target URL');
                return;
            }

            // Create challenge first
            try {
                await fetch(`${API_BASE}/challenges`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenge_id: challengeId,
                        description: description,
                        target_url: targetUrl,
                        category: 'web',
                        difficulty: 'easy'
                    })
                });
            } catch (error) {
                console.error('Error creating challenge:', error);
            }

            // Start run
            try {
                const response = await fetch(`${API_BASE}/runs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenge_id: challengeId,
                        target_url: targetUrl
                    })
                });

                const data = await response.json();
                currentRunId = data.run_id;

                // Update UI
                document.getElementById('startBtn').disabled = true;
                document.getElementById('startBtn').innerHTML = '<span class="loading"></span>Running...';
                updateStatus('running', 'Agent is running...');

                // Start polling for status
                statusInterval = setInterval(checkStatus, 2000);

            } catch (error) {
                console.error('Error starting run:', error);
                alert('Error starting agent: ' + error.message);
            }
        }

        async function checkStatus() {
            if (!currentRunId) return;

            try {
                const response = await fetch(`${API_BASE}/runs/${currentRunId}`);
                const data = await response.json();

                if (data.status === 'running') {
                    updateStatus('running', `Agent running... Step: ${data.steps}`);
                    loadTrajectory();
                } else if (data.status === 'solved') {
                    clearInterval(statusInterval);
                    updateStatus('solved', `Challenge solved! Steps: ${data.steps}`);
                    if (data.flag) {
                        showFlag(data.flag);
                    }
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('startBtn').innerHTML = 'Start Agent';
                    loadTrajectory();
                } else if (data.status === 'failed') {
                    clearInterval(statusInterval);
                    updateStatus('failed', 'Agent failed to solve challenge');
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('startBtn').innerHTML = 'Start Agent';
                    loadTrajectory();
                }

            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        async function loadTrajectory() {
            if (!currentRunId) return;

            try {
                const response = await fetch(`${API_BASE}/runs/${currentRunId}/trajectory`);
                const data = await response.json();

                const trajectoryDiv = document.getElementById('trajectory');
                if (data.trajectory && data.trajectory.length > 0) {
                    trajectoryDiv.innerHTML = data.trajectory.map(step => `
                        <div class="trajectory-step">
                            <h4>Step ${step.step}</h4>
                            <p><strong>Hypothesis:</strong> ${step.hypothesis}</p>
                            <p><strong>Action:</strong> ${JSON.stringify(step.action)}</p>
                            <p><strong>Result:</strong> ${step.result.substring(0, 200)}...</p>
                            ${step.flag_found ? '<p style="color: green; font-weight: bold;">FLAG FOUND!</p>' : ''}
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading trajectory:', error);
            }
        }

        function updateStatus(status, message) {
            const statusDiv = document.getElementById('statusDisplay');
            statusDiv.className = `status ${status}`;
            statusDiv.innerHTML = `<p>${message}</p>`;
        }

        function showFlag(flag) {
            const flagDiv = document.getElementById('flagDisplay');
            flagDiv.style.display = 'block';
            flagDiv.className = 'flag';
            flagDiv.innerHTML = `🚩 FLAG: ${flag}`;
        }

        async function searchKnowledge() {
            const query = document.getElementById('searchQuery').value;
            if (!query) return;

            try {
                const response = await fetch(`${API_BASE}/knowledge/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, max_results: 5 })
                });

                const data = await response.json();
                const resultsDiv = document.getElementById('searchResults');

                if (data.results && data.results.length > 0) {
                    resultsDiv.innerHTML = data.results.map((result, index) => `
                        <div style="padding: 10px; margin: 5px 0; background: #f8f9fa; border-radius: 4px;">
                            <strong>${index + 1}.</strong> ${result.substring(0, 300)}...
                        </div>
                    `).join('');
                } else {
                    resultsDiv.innerHTML = '<p>No results found</p>';
                }
            } catch (error) {
                console.error('Error searching knowledge:', error);
                resultsDiv.innerHTML = '<p>Error searching knowledge base</p>';
            }
        }
    </script>
</body>
</html>
